name: Build B636 with exact Huawei Manager login
on:
  push:
    branches:
      - build/b636-controller
    paths:
      - '.github/workflows/build-b636-huawei-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Install Android SDK 34
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Get tested Huawei Manager implementation
        run: |
          git clone https://github.com/degdag/huawei-manager.git huawei-core
          cd huawei-core
          git checkout --detach 520fccdcf341b2ee641e466ff278883556d0a729
      - name: Adapt identity and IP only; never store router password
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("huawei-core")
          kt=base/"app/src/main/java/com/nasser/huaweimanager/MainActivity.kt"
          s=kt.read_text()
          original=s
          s=s.replace('http://192.168.8.1','http://192.168.1.1')
          # Keep network client and login algorithm entirely unchanged.
          s=s.replace('    private var selectedMode = "03"', '    private var selectedMode = "03"\n    private var sessionPassword: String? = null')
          s=s.replace('''            val u = prefs.getString("user", "admin") ?: "admin"
                      val p = prefs.getString("pass", "dns12345") ?: "dns12345"
                      hilink.login(u, p)
                      startLoop()''', '''            startLoop()''')
          # The source's exact indentation in onCreate is 12 spaces, not 22.
          if 'dns12345' in s:
              s=s.replace('''            val u = prefs.getString("user", "admin") ?: "admin"
            val p = prefs.getString("pass", "dns12345") ?: "dns12345"
            hilink.login(u, p)
            startLoop()''','''            startLoop()''')
          s=s.replace('setText(prefs.getString("pass", "dns12345"))','setText("")')
          s=s.replace('prefs.edit().putString("user", u).putString("pass", p).apply()', 'prefs.edit().putString("user", u).remove("pass").apply()\n                sessionPassword = p')
          s=s.replace('''                    val p = prefs.getString("pass", "dns12345") ?: "dns12345"
                    hilink.login(u, p)''','''                    val p = sessionPassword
                    if (!p.isNullOrBlank()) hilink.login(u, p)''')
          # Sanitize any remaining occurrences in upstream variants.
          s=s.replace('"dns12345"','""')
          s=s.replace('''            val u = prefs.getString("user", "admin") ?: "admin"
            val p = prefs.getString("pass", "") ?: ""
            hilink.login(u, p)
            startLoop()''','''            startLoop()''')
          s=s.replace('''                    val p = prefs.getString("pass", "") ?: ""
                    hilink.login(u, p)''','''                    val p = sessionPassword
                    if (!p.isNullOrBlank()) hilink.login(u, p)''')
          assert 'dns12345' not in s, "Unsafe hardcoded original default password remains"
          assert 'hilink.login(u, p)\n            startLoop()' not in s, "Startup should not auto-login without user password"
          assert 'sessionPassword = p' in s
          assert 'hilink.login(u, p)' in s
          assert s!=original
          kt.write_text(s)
          client=base/"app/src/main/java/com/nasser/huaweimanager/HilinkClient.kt"
          c=client.read_text()
          assert 'class HilinkClient' in c and 'password_type>4' in c
          client.write_text(c.replace('http://192.168.8.1','http://192.168.1.1'))
          gradle=base/"app/build.gradle.kts"
          g=gradle.read_text()
          assert 'applicationId = "com.nasser.huaweimanager"' in g
          g=g.replace('applicationId = "com.nasser.huaweimanager"','applicationId = "com.b636control.huaweicore"')
          g=g.replace('versionName = "1.0"','versionName = "0.8.0"')
          g=g.replace('versionCode = 1','versionCode = 8')
          gradle.write_text(g)
          manifest=base/"app/src/main/AndroidManifest.xml"
          m=manifest.read_text().replace('android:label="Huawei Manager"','android:label="B636 Control Huawei Core"')
          manifest.write_text(m)
          print("Network stack and Huawei type-4 authentication implementation: unchanged")
          print("Changed default router IP, app ID/name, removed hardcoded and persistent password")
          PY
      - name: Compile standalone Huawei-core APK
        working-directory: huawei-core
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: B636-Huawei-Manager-Core-APK
          path: huawei-core/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
